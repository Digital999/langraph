<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能查询助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .clear-session-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }
        
        .clear-session-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message.assistant .message-content.preserve-whitespace {
            white-space: pre-wrap; /* 保留换行符和空格 */
        }
        
        .report-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .report-link:hover {
            background: #45a049;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }
        
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #userInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        #sendBtn:hover {
            transform: scale(1.05);
        }
        
        #sendBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1);
        }
        
        .typing-indicator {
            display: inline-block;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="clear-session-btn" onclick="clearSession()" title="清除当前会话并开始新对话">🔄 新会话</button>
            <h1>🤖 AI 智能查询助手</h1>
            <p>支持查询用户套餐、实名信息、身份验证等</p>
        </div>
        
        <div class="chat-area" id="chatArea">
            <div class="message assistant">
                <div class="message-content">
                    您好！我是智能查询助手，可以帮您查询：<br>
                    • 用户套餐信息<br>
                    • 实名认证信息<br>
                    • 身份验证<br><br>
                    请提供您的11位手机号码开始查询 📱
                </div>
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="userInput" placeholder="输入消息或手机号码..." />
            <button id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
    </div>
    
    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        // 生成唯一的 session_id
        function generateSessionId() {
            // 使用时间戳 + 随机字符串 + 额外的随机数确保唯一性
            const timestamp = Date.now();
            const random1 = Math.random().toString(36).substring(2, 11);
            const random2 = Math.random().toString(36).substring(2, 11);
            return `session_${timestamp}_${random1}${random2}`;
        }
        
        // 每次页面加载都生成新的 session_id（不使用 sessionStorage）
        let sessionId = generateSessionId();
        console.log('新会话创建:', sessionId);
        
        // 在页面标题显示会话ID（可选，用于调试）
        // document.title = `AI 智能查询助手 [${sessionId.substr(0, 15)}...]`;
        
        // 回车发送
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendMessage();
            }
        });
        
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            // 为助手消息添加 preserve-whitespace 类，以保留换行符
            if (!isUser) {
                contentDiv.classList.add('preserve-whitespace');
            }
            contentDiv.innerHTML = content;
            
            messageDiv.appendChild(contentDiv);
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            
            return contentDiv;
        }
        
        function addTypingIndicator() {
            const indicator = addMessage('<div class="typing-indicator"><span></span><span></span><span></span></div>');
            return indicator.parentElement;
        }
        
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;
            
            // 添加用户消息
            addMessage(message, true);
            userInput.value = '';
            sendBtn.disabled = true;
            
            // 添加输入指示器
            const typingDiv = addTypingIndicator();
            
            try {
                const response = await fetch('/api/chat-stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        user_input: message,
                        session_id: sessionId
                    })
                });
                
                // 移除输入指示器
                typingDiv.remove();
                
                // 创建助手消息容器
                const assistantContent = addMessage('');
                let fullContent = '';
                let reportUrl = '';
                let performanceMetrics = null;
                
                // 读取流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'start') {
                                    // 流式开始
                                    console.log('流式响应开始');
                                } else if (data.type === 'content') {
                                    fullContent += data.content;
                                    assistantContent.textContent = fullContent;
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                } else if (data.type === 'report') {
                                    // 报告生成完成，只添加下载按钮
                                    reportUrl = data.url;
                                    assistantContent.innerHTML = fullContent + 
                                        `<br><br><a href="${reportUrl}" class="report-link" download>📄 下载报告</a>`;
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                } else if (data.type === 'progress') {
                                    fullContent += data.message;
                                    assistantContent.textContent = fullContent;
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                } else if (data.type === 'performance') {
                                    performanceMetrics = data.metrics;
                                    console.log('性能统计:', performanceMetrics);
                                } else if (data.type === 'end') {
                                    // 在控制台显示性能统计（可选）
                                    if (performanceMetrics) {
                                        console.log('📊 性能统计详情:');
                                        for (const [key, value] of Object.entries(performanceMetrics)) {
                                            console.log(`  ${key}: ${value.toFixed(2)}ms`);
                                        }
                                    }
                                }
                            } catch (e) {
                                console.error('解析错误:', e);
                            }
                        }
                    }
                }
                
            } catch (error) {
                typingDiv.remove();
                addMessage('抱歉，发生错误: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
        
        // 清除会话并刷新页面
        function clearSession() {
            if (confirm('确定要开始新会话吗？当前对话将被清除。')) {
                location.reload();
            }
        }
    </script>
</body>
</html>
